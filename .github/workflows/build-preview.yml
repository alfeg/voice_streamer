name: Build DroneHerald preview APK

on:
  push:
    branches: ['feature/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain for the kolibri native core
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: flutter --version

      - name: Provision Piper RU TTS model (zip asset)
        env:
          VOICE: vits-piper-ru_RU-irina-medium
          BASE: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models
        run: |
          set -euo pipefail
          mkdir -p assets/tts
          if [ ! -f "assets/tts/$VOICE.zip" ]; then
            curl -fL --retry 3 -o /tmp/tts.tar.bz2 "$BASE/$VOICE.tar.bz2"
            tar xjf /tmp/tts.tar.bz2 -C assets/tts
            if [ ! -f "assets/tts/$VOICE/model.onnx" ]; then
              mv "assets/tts/$VOICE"/*.onnx "assets/tts/$VOICE/model.onnx"
            fi
            ( cd "assets/tts/$VOICE" && zip -qr "../$VOICE.zip" . )
          fi
          ls -lh "assets/tts/$VOICE.zip"

      - name: Set up release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF
          echo "Release signing configured"

      # Release APKs take their versionCode from the release workflow's run
      # number. Matching the latest one lets a preview install over the current
      # release and still be replaced by the next release.
      - name: Resolve versionCode
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh run list -R "$GITHUB_REPOSITORY" -w release.yml -L 1 --json number --jq '.[0].number')
          echo "build_number=$number" >> "$GITHUB_OUTPUT"
          echo "versionCode $number"

      - run: flutter pub get

      - name: Build release APKs
        run: >
          flutter build apk --release --flavor komet --split-per-abi
          --build-number=${{ steps.ver.outputs.build_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: droneherald-preview-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
