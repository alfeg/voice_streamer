name: Build DroneHerald APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: Android versionCode (defaults to the pubspec build number)
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain for the kolibri native core
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: flutter --version

      - name: Provision Piper RU TTS model (zip asset)
        env:
          VOICE: vits-piper-ru_RU-irina-medium
          BASE: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models
        run: |
          set -euo pipefail
          mkdir -p assets/tts
          if [ ! -f "assets/tts/$VOICE.zip" ]; then
            curl -fL --retry 3 -o /tmp/tts.tar.bz2 "$BASE/$VOICE.tar.bz2"
            tar xjf /tmp/tts.tar.bz2 -C assets/tts
            if [ ! -f "assets/tts/$VOICE/model.onnx" ]; then
              mv "assets/tts/$VOICE"/*.onnx "assets/tts/$VOICE/model.onnx"
            fi
            ( cd "assets/tts/$VOICE" && zip -qr "../$VOICE.zip" . )
          fi
          ls -lh "assets/tts/$VOICE.zip"

      - name: Set up release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF
          echo "Release signing configured"

      - run: flutter pub get

      - name: Build release APKs
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: >
          flutter build apk --release --flavor komet --split-per-abi
          ${BUILD_NUMBER:+--build-number=$BUILD_NUMBER}

      - uses: actions/upload-artifact@v4
        with:
          name: droneherald-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
